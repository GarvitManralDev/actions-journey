name: Build Report

on: push

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate report
        run: |
          echo "Build Report" > report.txt
          echo "Date: $(date)" >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          retention-days: 5
